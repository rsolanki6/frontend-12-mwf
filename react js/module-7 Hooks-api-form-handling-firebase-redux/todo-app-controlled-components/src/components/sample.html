<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Header -->
    <header class="bg-teal-500 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">

            <!-- Logo -->
            <h1 class="text-2xl font-bold">TodoApp</h1>

            <!-- Hamburger Toggle -->
            <input type="checkbox" id="menu-toggle" class="peer hidden">

            <label for="menu-toggle" class="md:hidden cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg"
                     class="w-8 h-8"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke="currentColor">
                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </label>

            <!-- Desktop Menu -->
            <nav class="hidden md:flex gap-6">
                <a href="#" class="hover:text-gray-200">Home</a>
                <a href="#" class="hover:text-gray-200">Tasks</a>
                <a href="#" class="hover:text-gray-200">Completed</a>
                <a href="#" class="hover:text-gray-200">Profile</a>
            </nav>
        </div>

        <!-- Mobile Menu -->
        <nav class="hidden peer-checked:block md:hidden bg-teal-600">
            <ul class="flex flex-col p-4 space-y-3">
                <li><a href="#" class="block">Home</a></li>
                <li><a href="#" class="block">Tasks</a></li>
                <li><a href="#" class="block">Completed</a></li>
                <li><a href="#" class="block">Profile</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto p-4 mt-8">

        <!-- Add Task Card -->
        <div class="bg-white rounded-2xl shadow-lg p-6">

            <h2 class="text-2xl font-bold text-gray-800 mb-6">
                Add New Task
            </h2>

            <form class="flex flex-col md:flex-row gap-4">
                <input
                    type="text"
                    placeholder="Enter task..."
                    class="flex-1 border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500"
                >

                <button
                    type="submit"
                    class="bg-teal-500 hover:bg-teal-600 text-white px-6 py-3 rounded-xl font-semibold transition">
                    Add Task
                </button>
            </form>
        </div>

        <!-- Task List -->
        <div class="mt-8">

            <h2 class="text-2xl font-bold text-gray-800 mb-4">
                My Tasks
            </h2>

            <div class="space-y-4">

                <!-- Task Item -->
                <div class="bg-white p-4 rounded-xl shadow flex flex-col sm:flex-row justify-between items-center gap-4">
                    <span class="text-gray-700 font-medium">
                        Complete Tailwind CSS Project
                    </span>

                    <div class="flex gap-3">
                        <button class="bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded-lg">
                            Edit
                        </button>

                        <button class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg">
                            Delete
                        </button>
                    </div>
                </div>

                <!-- Task Item -->
                <div class="bg-white p-4 rounded-xl shadow flex flex-col sm:flex-row justify-between items-center gap-4">
                    <span class="text-gray-700 font-medium">
                        Learn React Hooks
                    </span>

                    <div class="flex gap-3">
                        <button class="bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded-lg">
                            Edit
                        </button>

                        <button class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg">
                            Delete
                        </button>
                    </div>
                </div>

                <!-- Task Item -->
                <div class="bg-white p-4 rounded-xl shadow flex flex-col sm:flex-row justify-between items-center gap-4">
                    <span class="text-gray-700 font-medium">
                        Build Responsive Dashboard
                    </span>

                    <div class="flex gap-3">
                        <button class="bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded-lg">
                            Edit
                        </button>

                        <button class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg">
                            Delete
                        </button>
                    </div>
                </div>

            </div>
        </div>

    </main>

</body>
</html>
